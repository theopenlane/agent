token: ${OPENLANE_AGENT_TOKEN}
apiUrl: https://api.theopenlane.io
agentName: production-compliance-agent
logLevel: info
dataDir: ./data
pollInterval: 1m
spawn: 1
maxConcurrency: 3
defaultTimeout: 5m

evidence:
  enabled: true
  retentionPeriod: 720h
  maxFileSize: 104857600
  compressFiles: false

offline:
  mode: buffered
  outputDir: ./results
  outputFormat: json
  bufferDir: ./buffer
  connectivityCheckUrl: ""
  connectivityInterval: 30s
  syncInterval: 5m
  maxRetries: 5
  bufferRetentionPeriod: 168h

retry:
  maxAttempts: 5
  initialDelay: 1s
  maxDelay: 30s
  strategy: exponential
  multiplier: 2

checks:
  - name: disk-encryption-check
    description: Verify that full disk encryption is enabled on the system
    command: ./scripts/check-disk-encryption.sh
    schedule: "0 6 * * *"
    timeout: 5m
    env:
      - ENCRYPTION_POLICY=required
    complianceStandards:
      - standard: soc2v2022
        controls:
          - CC6.7
      - standard: iso27001v2022
        controls:
          - A.10.1.1
    tags:
      - encryption
      - storage
      - host-security
    enabled: true
    evidencePaths:
      - ./evidence/disk-encryption-check/
    onPass:
      uploadEvidence: true
    onFail:
      uploadEvidence: true
      commands:
        - name: create-security-incident
          command: ./scripts/create-incident.sh
          args:
            - --type
            - encryption
            - --severity
            - high
          timeout: 1m
