# Test configuration for offline buffering functionality
registrationToken: "test-token"
apiUrl: "https://api.theopenlane.io"
agentName: "offline-test-agent"
logLevel: "debug"
dataDir: "./test-data/data"
pollInterval: "30s"
spawn: 1
maxConcurrency: 2
defaultTimeout: "5m"

# Enable offline buffering
offline:
  enabled: true
  bufferDir: "./test-data/buffer"
  connectivityCheckUrl: "https://api.theopenlane.io/livez"
  connectivityInterval: "10s"
  syncInterval: "30s"
  maxRetries: 3
  bufferRetentionPeriod: "1h"

evidence:
  enabled: true
  retentionPeriod: "24h"
  maxFileSize: 10485760  # 10MB
  compressFiles: false

checks:
  - name: "test-connectivity-check"
    description: "Test check for offline buffering"
    command: "echo"
    args: ["Connectivity test passed"]
    schedule: "* * * * *"  # Every minute
    timeout: "10s"
    enabled: true
    controls: ["TEST-001"]
    tags: ["connectivity", "test"]
    continueOnError: true
