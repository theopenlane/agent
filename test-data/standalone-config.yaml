# Standalone mode configuration - runs completely independently  
registrationToken: ""  # Not needed in standalone mode but required for config structure
apiUrl: ""              # Not needed in standalone mode but required for config structure
agentName: "standalone-test-agent"
logLevel: "debug"
dataDir: "./test-data/data"
pollInterval: "30s"
spawn: 1
maxConcurrency: 2
defaultTimeout: "5m"

# Standalone mode - no API connectivity
offline:
  mode: "standalone"
  outputDir: "./test-data/results"
  outputFormat: "json"

evidence:
  enabled: true
  retentionPeriod: "24h"
  maxFileSize: 10485760  # 10MB
  compressFiles: false

checks:
  - name: "system-info-check"
    description: "Collect basic system information"
    command: "uname"
    args: ["-a"]
    schedule: "0 */6 * * *"  # Every 6 hours
    timeout: "30s"
    enabled: true
    controls: ["SYS-001"]
    tags: ["system", "info"]
    continueOnError: true
    
  - name: "disk-space-check"
    description: "Check available disk space"
    command: "df"
    args: ["-h", "/"]
    schedule: "0 */2 * * *"  # Every 2 hours
    timeout: "30s"
    enabled: true
    controls: ["SYS-002"]
    tags: ["system", "storage"]
    continueOnError: true