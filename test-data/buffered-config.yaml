# Buffered mode configuration - normal API operation with local buffering fallback
registrationToken: "test-token"
apiUrl: "https://api.theopenlane.io"
agentName: "buffered-test-agent"
logLevel: "debug"
dataDir: "./test-data/data"
pollInterval: "30s"
spawn: 1
maxConcurrency: 2
defaultTimeout: "5m"

# Buffered mode - API with fallback buffering
offline:
  mode: "buffered"
  bufferDir: "./test-data/buffer"
  connectivityCheckUrl: "https://api.theopenlane.io/livez"
  connectivityInterval: "15s"
  syncInterval: "1m"
  maxRetries: 3
  bufferRetentionPeriod: "2h"

evidence:
  enabled: true
  retentionPeriod: "24h"
  maxFileSize: 10485760  # 10MB
  compressFiles: false

checks:
  - name: "api-connectivity-test"
    description: "Test API connectivity and buffering"
    command: "curl"
    args: ["-f", "-s", "https://api.theopenlane.io/livez"]
    schedule: "*/5 * * * *"  # Every 5 minutes
    timeout: "10s"
    enabled: true
    controls: ["NET-001"]
    tags: ["connectivity", "api"]
    continueOnError: true
    
  - name: "compliance-check"
    description: "Sample compliance check"
    command: "echo"
    args: ["Compliance check completed"]
    schedule: "0 */1 * * *"  # Every hour
    timeout: "10s"
    enabled: true
    controls: ["COMP-001"]
    tags: ["compliance", "test"]
    continueOnError: true