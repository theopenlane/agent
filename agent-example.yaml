# Openlane Agent Configuration Example
# This configuration demonstrates evidence collection and pass/fail actions

# API connection settings
registrationToken: "${OPENLANE_REGISTRATION_TOKEN}"  # Required: Token for platform registration
apiUrl: "https://api.theopenlane.io"                    # Openlane platform API URL

# Agent identification
agentName: "production-compliance-agent"             # Human-readable agent name
# agentId: "auto-generated-if-not-specified"        # Optional: Unique agent identifier

# Global settings
logLevel: "info"                                     # Log level: debug, info, warn, error
dataDir: "./data"                                    # Directory for agent data storage
pollInterval: "1m"                                   # How often to poll platform for work

# Execution settings
spawn: 1                                             # Number of worker processes
maxConcurrency: 3                                    # Max concurrent check executions
defaultTimeout: "5m"                                 # Default timeout for checks

# Evidence collection settings
evidence:
  enabled: true                                      # Enable evidence collection
  retentionPeriod: "30d"                            # How long to keep evidence files
  maxFileSize: 104857600                             # Max evidence file size (100MB)
  compressFiles: false                               # Compress evidence files

# Local compliance checks
checks:
  # AWS IAM Compliance Check
  - name: "aws-iam-compliance"
    description: "Check AWS IAM configuration for compliance issues"
    command: "./scripts/check-aws-iam.sh"
    schedule: "0 */4 * * *"                          # Every 4 hours
    timeout: "10m"
    env:
      - "AWS_REGION=us-east-1"
    controls:
      - "SOC2:CC6.1"
      - "ISO27001:A.9.2.1"
    tags:
      - "aws"
      - "iam"
      - "critical"
    enabled: true
    evidencePaths:                                   # Files/directories to collect as evidence
      - "./evidence/aws-iam/"
      - "./logs/aws-audit.json"
    onPass:                                          # Actions when check passes
      uploadEvidence: true                           # Upload evidence to controls
      updateControlStatus: true                      # Mark controls as compliant
    onFail:                                          # Actions when check fails
      uploadEvidence: true                           # Upload evidence even on failure
      updateControlStatus: true                      # Mark controls as non-compliant
      commands:                                      # Commands to execute
        - name: "create-remediation-ticket"
          command: "./scripts/create-ticket.sh"
          args:
            - "--category"
            - "iam"
            - "--priority"
            - "high"
          timeout: "1m"

  # Disk Encryption Compliance Check
  - name: "disk-encryption-check"
    description: "Verify that full disk encryption is enabled on the system"
    command: "./scripts/check-disk-encryption.sh"
    schedule: "0 6 * * *"                            # Daily at 6 AM
    timeout: "5m"
    env:
      - "ENCRYPTION_POLICY=required"
    controls:
      - "SOC2:CC6.7"
      - "ISO27001:A.10.1.1"
      - "NIST:SC-28"
    tags:
      - "encryption"
      - "storage"
      - "host-security"
    enabled: true
    evidencePaths:
      - "./evidence/disk-encryption-check/"
    onPass:
      uploadEvidence: true
      updateControlStatus: true
    onFail:
      uploadEvidence: true
      updateControlStatus: true
      commands:
        - name: "enable-encryption-reminder"
          command: "./scripts/encryption-remediation.sh"
          args:
            - "--notify"
            - "--escalate"
          timeout: "2m"
          continueOnError: true                      # Don't stop if this fails
        - name: "create-security-incident"
          command: "./scripts/create-incident.sh"
          args:
            - "--type"
            - "encryption"
            - "--severity"
            - "high"
            - "--auto-assign"
          timeout: "1m"

  # Network Security Scan
  - name: "network-security-scan"
    description: "Scan network configuration for security issues"
    command: "python3"
    args:
      - "./scripts/network-scan.py"
      - "--output"
      - "./evidence/network-scan/"
    workDir: "./security-tools"
    schedule: "0 2 * * *"                            # Daily at 2 AM
    timeout: "15m"
    env:
      - "SCAN_MODE=compliance"
      - "OUTPUT_FORMAT=json"
    controls:
      - "NIST:SC-7"
      - "SOC2:CC6.6"
    tags:
      - "network"
      - "security"
      - "scanning"
    enabled: true
    evidencePaths:
      - "./evidence/network-scan/"
      - "./logs/network-audit.log"
    onPass:
      uploadEvidence: true
      updateControlStatus: true
    onFail:
      uploadEvidence: true
      updateControlStatus: true
      commands:
        - name: "network-security-alert"
          command: "./scripts/security-alert.sh"
          args:
            - "--type"
            - "network"
            - "--scan-results"
            - "./evidence/network-scan/latest.json"
          timeout: "30s"

  # Database Compliance Check (Disabled by default)
  - name: "database-compliance"
    description: "Check database security settings and access controls"
    command: "./scripts/check-database.rb"
    schedule: "*/30 * * * *"                         # Every 30 minutes
    timeout: "2m"
    controls:
      - "PCI-DSS:8.2"
      - "SOC2:CC6.2"
    tags:
      - "database"
      - "security"
      - "access-control"
    enabled: false                                   # Disabled by default
    evidencePaths:
      - "./evidence/database/"
    onPass:
      uploadEvidence: true
      updateControlStatus: true
    onFail:
      uploadEvidence: true
      updateControlStatus: true
      commands:
        - name: "database-security-check"
          command: "./scripts/db-security-audit.sh"
          timeout: "5m"

  # File System Permissions Check
  - name: "filesystem-permissions"
    description: "Audit critical file system permissions"
    command: "bash"
    args:
      - "./scripts/check-permissions.sh"
      - "/etc"
      - "/var/log"
      - "/opt"
    schedule: "0 */6 * * *"                          # Every 6 hours
    timeout: "3m"
    controls:
      - "NIST:AC-3"
      - "ISO27001:A.9.1.1"
    tags:
      - "filesystem"
      - "permissions"
      - "access-control"
    enabled: true
    evidencePaths:
      - "./evidence/filesystem-permissions/"
    onPass:
      uploadEvidence: true
      updateControlStatus: true
    onFail:
      uploadEvidence: true
      updateControlStatus: true
      commands:
        - name: "fix-critical-permissions"
          command: "./scripts/fix-permissions.sh"
          args:
            - "--critical-only"
            - "--audit-log"
            - "./evidence/filesystem-permissions/fixes.log"
          timeout: "2m"
          continueOnError: true
