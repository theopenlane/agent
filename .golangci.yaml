version: "2"
run:
  modules-download-mode: readonly
  tests: false
  allow-parallel-runners: true
linters:
  enable:
    - bodyclose
    - err113
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - mnd
    - noctx
    - revive
    - staticcheck
    - whitespace
    - wsl_v5
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - yourpaths/
formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/theopenlane/[reponame]
  exclusions:
    generated: lax
    warn-unused: true
    paths:
      - yourpaths/
issues:
  fix: true
