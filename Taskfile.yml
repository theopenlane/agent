version: '3'

vars:
  OPENLANE_API_URL: http://localhost:17608
  TEST_CONFIG: test-agent.yaml
  AGENT_NAME: test-compliance-agent
  TEST_SCRIPT: ./test-data/scripts/test-check.sh

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the openlane-agent binary
    cmds:
      - go build -o openlane-agent ./main.go
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - openlane-agent

  test-setup:
    desc: Set up test environment and dependencies
    cmds:
      - mkdir -p ./test-data
      - chmod +x ./test-data/scripts/test-check.sh
      - |
        if [ -z "$OPENLANE_REGISTRATION_TOKEN" ]; then
          echo "WARNING: OPENLANE_REGISTRATION_TOKEN not set"
          echo "Please set this environment variable to test API integration"
        fi

  config-check:
    desc: Validate the test configuration
    deps: [build]
    cmds:
      - |
        if [ -f .env ]; then
          source .env
        fi
        OPENLANE_REGISTRATION_TOKEN="$OPENLANE_REGISTRATION_TOKEN" ./openlane-agent start --config {{.TEST_CONFIG}} --dry-run --api-url {{.OPENLANE_API_URL}}

  run-single-check:
    desc: Run a single compliance check locally
    deps: [build, test-setup]
    cmds:
      - ./openlane-agent check local-security-scan --config {{.TEST_CONFIG}}

  start-agent:
    desc: Start the compliance agent (foreground)
    deps: [build, test-setup, config-check]
    cmds:
      - |
        if [ -f .env ]; then
          source .env
        fi
        echo "Starting openlane-agent..."
        echo "Config: {{.TEST_CONFIG}}"
        echo "API URL: {{.OPENLANE_API_URL}}"
        echo "Agent Name: {{.AGENT_NAME}}"
        echo ""
        OPENLANE_REGISTRATION_TOKEN="$OPENLANE_REGISTRATION_TOKEN" ./openlane-agent start --config {{.TEST_CONFIG}} --no-daemon --log-level debug --api-url {{.OPENLANE_API_URL}}

  start-agent-bg:
    desc: Start the compliance agent in background
    deps: [build, test-setup, config-check]
    cmds:
      - |
        if [ -f .env ]; then
          source .env
        fi
        echo "Starting openlane-agent in background..."
        nohup env OPENLANE_REGISTRATION_TOKEN="$OPENLANE_REGISTRATION_TOKEN" ./openlane-agent start --config {{.TEST_CONFIG}} --no-daemon --log-level debug --api-url {{.OPENLANE_API_URL}} > agent.log 2>&1 &
        echo $! > agent.pid
        echo "Agent started with PID: $(cat agent.pid)"
        echo "Logs: tail -f agent.log"

  stop-agent:
    desc: Stop the background agent
    cmds:
      - |
        if [ -f agent.pid ]; then
          PID=$(cat agent.pid)
          echo "Stopping agent (PID: $PID)..."
          kill $PID || echo "Process not found"
          rm -f agent.pid
        else
          echo "No agent.pid file found"
        fi

  agent-status:
    desc: Check agent status and logs
    cmds:
      - |
        if [ -f agent.pid ]; then
          PID=$(cat agent.pid)
          if ps -p $PID > /dev/null; then
            echo "Agent running (PID: $PID)"
          else
            echo "Agent not running (stale PID file)"
            rm -f agent.pid
          fi
        else
          echo "Agent not running"
        fi
      - |
        if [ -f agent.log ]; then
          echo ""
          echo "Recent logs:"
          tail -10 agent.log
        fi

  generate-token:
    desc: Generate a registration token via openlane CLI
    cmds:
      - |
        # Try to use openlane CLI if available
        if command -v openlane >/dev/null 2>&1; then
          echo "Creating token with openlane CLI..."
          TOKEN=$(openlane token create --name "agent-token-$(date +%s)" --output json | jq -r '.token' 2>/dev/null || openlane token create --name "agent-token-$(date +%s)")
          if [ "$TOKEN" != "null" ] && [ -n "$TOKEN" ]; then
            echo "OPENLANE_REGISTRATION_TOKEN=$TOKEN" > .env
            echo "Token generated and stored in .env file!"
            echo "Token: ${TOKEN:0:20}..."
          else
            echo "Failed to generate token with CLI"
          fi
        else
          echo "openlane CLI not found. Manual token generation required:"
          echo ""
          echo "Options:"
          echo "1. Install openlane CLI and run: task generate-token"
          echo "2. Use the web UI to create a token"
          echo "3. Use curl with admin credentials:"
          echo "   curl -X POST {{.OPENLANE_API_URL}}/graphql \\"
          echo "        -H 'Authorization: Bearer <admin-token>' \\"
          echo "        -H 'Content-Type: application/json' \\"
          echo "        -d '{\"query\": \"mutation { createPersonalAccessToken(input: {name: \\\"agent-token\\\"}) { personalAccessToken { token } } }\"}'"
          echo ""
          echo "Then store it with: task store-token -- <your-token>"
        fi

  store-token:
    desc: Store registration token in environment file
    cmds:
      - |
        if [ -z "$1" ]; then
          echo "Usage: task store-token -- <token>"
          echo "Example: task store-token -- tok_abc123..."
          exit 1
        fi
        echo "OPENLANE_REGISTRATION_TOKEN=$1" > .env
        echo "Token stored in .env file"
        echo "Source it with: source .env"

  load-token:
    desc: Load token from .env file
    cmds:
      - |
        if [ -f .env ]; then
          source .env
          echo "Token loaded: ${OPENLANE_REGISTRATION_TOKEN:0:10}..."
        else
          echo "No .env file found. Use 'task store-token -- <token>' first"
        fi

  test-token:
    desc: Test if the registration token works
    cmds:
      - |
        if [ -f .env ]; then
          source .env
        fi
        if [ -z "$OPENLANE_REGISTRATION_TOKEN" ]; then
          echo "No token found. Set OPENLANE_REGISTRATION_TOKEN or use 'task store-token'"
          exit 1
        fi
        cat > test_token.go << 'EOF'
        package main

        import (
            "context"
            "fmt"
            "log"
            "net/url"
            "os"

            "github.com/theopenlane/core/pkg/openlaneclient"
        )

        func main() {
            token := os.Getenv("OPENLANE_REGISTRATION_TOKEN")
            if token == "" {
                log.Fatal("OPENLANE_REGISTRATION_TOKEN not set")
            }

            // Parse the API URL
            baseURL, err := url.Parse("{{.OPENLANE_API_URL}}")
            if err != nil {
                log.Fatalf("Invalid API URL: %v", err)
            }

            // Create credentials
            auth := openlaneclient.Authorization{
                BearerToken: token,
            }

            // Initialize client with credentials
            client, err := openlaneclient.NewWithDefaults(
                openlaneclient.WithBaseURL(baseURL),
                openlaneclient.WithCredentials(auth),
            )
            if err != nil {
                log.Fatalf("Failed to create client: %v", err)
            }

            ctx := context.Background()

            // Test token by trying to list job runners
            first := int64(1)
            result, err := client.GetJobRunners(ctx, &first, nil, nil)
            if err != nil {
                log.Fatalf("Token test failed: %v", err)
            }

            jobRunners := result.GetJobRunners()
            fmt.Printf("Token is valid! Found %d job runners\n", jobRunners.GetTotalCount())
        }
        EOF
        OPENLANE_REGISTRATION_TOKEN="$OPENLANE_REGISTRATION_TOKEN" go run test_token.go

  list-runners:
    desc: List job runners via API
    cmds:
      - |
        if [ -f .env ]; then
          source .env
        fi
        cat > list_runners.go << 'EOF'
        package main

        import (
            "context"
            "fmt"
            "log"
            "net/url"
            "os"

            "github.com/theopenlane/core/pkg/openlaneclient"
        )

        func main() {
            token := os.Getenv("OPENLANE_REGISTRATION_TOKEN")
            if token == "" {
                log.Fatal("OPENLANE_REGISTRATION_TOKEN not set")
            }

            // Parse the API URL
            baseURL, err := url.Parse("{{.OPENLANE_API_URL}}")
            if err != nil {
                log.Fatalf("Invalid API URL: %v", err)
            }

            // Create credentials
            auth := openlaneclient.Authorization{
                BearerToken: token,
            }

            // Initialize client with credentials
            client, err := openlaneclient.NewWithDefaults(
                openlaneclient.WithBaseURL(baseURL),
                openlaneclient.WithCredentials(auth),
            )
            if err != nil {
                log.Fatalf("Failed to create client: %v", err)
            }

            ctx := context.Background()
            first := int64(10)

            result, err := client.GetJobRunners(ctx, &first, nil, nil)
            if err != nil {
                log.Fatalf("Failed to list job runners: %v", err)
            }

            jobRunners := result.GetJobRunners()
            fmt.Printf("Found %d job runners:\n", jobRunners.GetTotalCount())
            
            for _, edge := range jobRunners.GetEdges() {
                runner := edge.GetNode()
                fmt.Printf("  - ID: %s\n", runner.GetID())
                fmt.Printf("    Name: %s\n", runner.GetName())
                fmt.Printf("    IP: %s\n", runner.GetIPAddress())
                fmt.Printf("    Status: %v\n", runner.GetStatus())
                fmt.Printf("    Created: %s\n", runner.GetCreatedAt().Format("2006-01-02 15:04:05"))
                fmt.Println()
            }
        }
        EOF
        OPENLANE_REGISTRATION_TOKEN="$OPENLANE_REGISTRATION_TOKEN" go run list_runners.go

  test-basic:
    desc: Basic functionality test
    deps: [build, test-setup]
    cmds:
      - echo "Testing basic agent functionality..."
      - echo ""
      - echo "1. Configuration validation:"
      - task: config-check
      - echo ""
      - echo "2. Single check execution:"
      - task: run-single-check
      - echo ""
      - echo "Basic test completed!"

  test-full-flow:
    desc: Test complete agent workflow
    deps: [build, test-setup]
    cmds:
      - echo "Testing complete agent workflow..."
      - echo ""
      - echo "1. Starting agent in background..."
      - task: start-agent-bg
      - echo ""
      - echo "2. Waiting for agent to register..."
      - sleep 10
      - echo ""
      - echo "3. Checking agent status..."
      - task: agent-status
      - echo ""
      - echo "4. Waiting for local checks to run..."
      - sleep 130
      - echo ""
      - echo "5. Checking final status..."
      - task: agent-status
      - echo ""
      - echo "6. Stopping agent..."
      - task: stop-agent
      - echo ""
      - echo "Full workflow test completed!"

  clean:
    desc: Clean up test artifacts
    cmds:
      - rm -f openlane-agent
      - rm -f agent.log
      - rm -f agent.pid
      - rm -f list_runners.go
      - rm -rf ./test-data
      - echo "Cleaned up test artifacts"

  debug-logs:
    desc: Show detailed agent logs
    cmds:
      - |
        if [ -f agent.log ]; then
          echo "Full agent logs:"
          cat agent.log
        else
          echo "No agent.log file found"
        fi

  health-check:
    desc: Quick health check of agent components
    deps: [build]
    cmds:
      - echo "Agent Health Check"
      - echo ""
      - echo "Configuration validation:"
      - task: config-check
      - echo ""
      - echo "Test check execution:"
      - task: run-single-check
      - echo ""
      - echo "Health check completed"